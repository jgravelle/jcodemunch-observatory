name: observatory

on:
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Pin jcodemunch-mcp to this exact version (e.g. 1.93.0). Empty = install latest. Use after a fresh PyPI publish to dodge CDN propagation lag. If PyPI install fails (e.g. quarantine), falls back to the GitHub-release wheel for the same version.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'observatory.config.json'
      - '.github/workflows/observatory.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install jcodemunch-mcp
        env:
          PINNED_VERSION: ${{ inputs.version }}
          # GitHub-release wheel fallback for when PyPI install fails. Active
          # during the PyPI quarantine (project-level: every version is gated,
          # so a PyPI version-pin can't dodge it). Harmless once PyPI is back —
          # the PyPI install succeeds first and the fallback never fires, so
          # this needs no revert when the quarantine lifts.
          FALLBACK_REPO: jgravelle/jcodemunch-mcp
        run: |
          set -o pipefail

          gh_wheel_install() {
            ver="$1"
            url="https://github.com/${FALLBACK_REPO}/releases/download/v${ver}/jcodemunch_mcp-${ver}-py3-none-any.whl"
            echo "::notice::PyPI unavailable; installing jcodemunch-mcp ${ver} from GitHub-release wheel"
            pip install --upgrade "$url"
          }

          if [ -n "$PINNED_VERSION" ]; then
            echo "::notice::installing jcodemunch-mcp==$PINNED_VERSION (pinned)"
            pip install --upgrade "jcodemunch-mcp==$PINNED_VERSION" || gh_wheel_install "$PINNED_VERSION"
          else
            echo "::notice::installing latest jcodemunch-mcp"
            if ! pip install --upgrade jcodemunch-mcp; then
              LATEST=$(curl -fsSL "https://api.github.com/repos/${FALLBACK_REPO}/releases/latest" \
                | python -c "import sys, json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
              echo "::notice::resolved latest GitHub release: $LATEST"
              gh_wheel_install "$LATEST"
            fi
          fi
          # Print the resolved version so reruns can spot CDN-propagation
          # mismatches without digging through pip output.
          INSTALLED=$(pip show jcodemunch-mcp | awk '/^Version:/ {print $2}')
          echo "::notice::resolved jcodemunch-mcp version: $INSTALLED"
          if [ -n "$PINNED_VERSION" ] && [ "$INSTALLED" != "$PINNED_VERSION" ]; then
            echo "::error::pinned version $PINNED_VERSION but pip resolved $INSTALLED"
            exit 1
          fi

      - name: Cache observatory workdir
        uses: actions/cache@v5
        with:
          path: .observatory_work
          # Cache key prefix tracks the jcm INDEX_VERSION. Bump when jcm
          # changes its index schema or import-graph semantics so cached
          # SQLite indexes don't shadow the new behavior. v13 (jcm 1.96.0)
          # added source_roots for #288 phase 2 (subdir merge); file paths
          # in the index are now git-root-relative.
          key: observatory-workdir-v13-${{ github.run_id }}
          restore-keys: |
            observatory-workdir-v13-

      - name: Build observatory
        run: |
          jcodemunch-mcp observatory build \
            --config observatory.config.json \
            --output-dir public \
            --workdir .observatory_work

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
