name: observatory

on:
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Pin jcodemunch-mcp to this exact version (e.g. 1.93.0). Empty = install latest. Use after a fresh PyPI publish to dodge CDN propagation lag.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'observatory.config.json'
      - '.github/workflows/observatory.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jcodemunch-mcp
        env:
          PINNED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PINNED_VERSION" ]; then
            echo "::notice::installing jcodemunch-mcp==$PINNED_VERSION (pinned)"
            pip install --upgrade "jcodemunch-mcp==$PINNED_VERSION"
          else
            echo "::notice::installing latest jcodemunch-mcp"
            pip install --upgrade jcodemunch-mcp
          fi
          # Print the resolved version so reruns can spot CDN-propagation
          # mismatches without digging through pip output.
          INSTALLED=$(pip show jcodemunch-mcp | awk '/^Version:/ {print $2}')
          echo "::notice::resolved jcodemunch-mcp version: $INSTALLED"
          if [ -n "$PINNED_VERSION" ] && [ "$INSTALLED" != "$PINNED_VERSION" ]; then
            echo "::error::pinned version $PINNED_VERSION but pip resolved $INSTALLED"
            exit 1
          fi

      - name: Cache observatory workdir
        uses: actions/cache@v4
        with:
          path: .observatory_work
          # Cache key prefix tracks the jcm INDEX_VERSION. Bump when jcm
          # changes its index schema or import-graph semantics so cached
          # SQLite indexes don't shadow the new behavior. v13 (jcm 1.96.0)
          # added source_roots for #288 phase 2 (subdir merge); file paths
          # in the index are now git-root-relative.
          key: observatory-workdir-v13-${{ github.run_id }}
          restore-keys: |
            observatory-workdir-v13-

      - name: Build observatory
        run: |
          jcodemunch-mcp observatory build \
            --config observatory.config.json \
            --output-dir public \
            --workdir .observatory_work

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
